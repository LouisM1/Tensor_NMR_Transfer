# Experiment 03 uses two structures per batch and four per optimiser update.
# For fresh ARC jobs, set the train.sbatch batching overrides to match.
# E/F source for the current symmetric-tensor pilot; no NMR labels are used.
# Four-layer backbone matches 01-SymmetricTensor-Scratch-N100 exactly,
# including the final 0e+2e feature blocks. Discard the invariant E/F head
# and E/F scales/offsets during subsequent tensor transfer.
general:
  seed: 42
  progress: logged

model:
  offset: +LearnableOffset()
  nequip:
    +nmr_helpers.tensor_ef_pretraining.TensorCompatibleEFNequIP:
      elements: [Si, O]
      cutoff: 6.0
      layers: 4
      radial_features: 64
      features:
        node_irreps: "128x0e + 128x0o + 128x1e + 128x1o + 128x2e + 128x2o"
        edge_irreps: "1x0e + 1x1o + 1x2e"
      backbone_target_irreps: "0e + 2e"
      readout_hidden_features: 128
      direct_force_predictions: false

data:
  train:
    path: data/train.xyz
    property_map: {QM_energy: energy, QM_forces: forces}
    n: 800
    shuffle: true
    seed: 42
  valid:
    path: data/valid.xyz
    property_map: {QM_energy: energy, QM_forces: forces}
  test: null

loss:
  energy:
    +PerAtomEnergyLoss:
      metric: MSE
      weight: 1000.0
  forces:
    +PropertyLoss:
      property: forces
      metric: MSE
      weight: 100.0

fitting:
  auto_fit_reference_energies: false
  pre_fit_model: true
  max_n_pre_fit: null
  trainer_kwargs:
    accelerator: auto
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 2
    max_epochs: 1000
    num_sanity_val_steps: 0
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 2
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  optimizer:
    name: AdamW
    lr: 0.003
    weight_decay: 0.01
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 300
  keep: best

wandb:
  entity: trin4011-university-of-oxford
  project: tensor-nmr-transfer
  name: 03-EF-Pretrain-TensorBackbone-Batch2
  log_model: false
