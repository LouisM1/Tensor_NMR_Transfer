# First symmetric-tensor pilot. Random initialisation; no E/F checkpoint loaded.
# Run via train.sbatch, or nmr_helpers.shared_head_training.train_from_config.
# Labels: orthonormal 0e+2e coefficients, not flattened Cartesian components.
general:
  seed: 42
  progress: logged

model:
  +nmr_helpers.symmetric_shielding.SymmetricTensorNequIP:
    elements: [Si, O]
    cutoff: 6.0
    layers: 4
    radial_features: 64
    features:
      node_irreps: "128x0e + 128x0o + 128x1e + 128x1o + 128x2e + 128x2o"
      edge_irreps: "1x0e + 1x1o + 1x2e"
    prune_last_layer: true
    target_tensor_irreps: "0e + 2e"
    # Helper fixes target_tensor_irreps=0e+2e and symmetry-safe scaling.

data:
  train:
    path: data/nmr_symm/train.xyz
    property_map: {MS_Symm_Irreps: tensor}
    n: 100
    shuffle: true
    seed: 42
  valid:
    path: data/nmr_symm/valid.xyz
    property_map: {MS_Symm_Irreps: tensor}
  test: null

loss:
  shielding:
    +nmr_helpers.symmetric_shielding.SymmetricBalancedMSE:
      # Fixed denominators from the 800-structure training pool; no val/test fit.
      si_iso_std: 8.789599019755547
      o_iso_std: 19.197689920683118
      si_aniso_rms: 18.027189481773213
      o_aniso_rms: 27.842888412488165
      weight: 1.0

fitting:
  pre_fit_model: true
  max_n_pre_fit: null
  callbacks:
    - +nmr_helpers.symmetric_shielding.SymmetricRMSELogger: {}
  trainer_kwargs:
    accelerator: auto
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 4
    max_epochs: 3000
    num_sanity_val_steps: 0
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  optimizer:
    name: AdamW
    lr: 0.003
    weight_decay: 0.01
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 300
  keep: best

wandb:
  entity: trin4011-university-of-oxford
  project: tensor-nmr-transfer
  name: 01-SymmetricTensor-Scratch-N100
  log_model: false
