# Experiment 06: symmetric tensor NMR, N=100, ELoRA from corrected Experiment 04.
# Same architecture/data/loss/batching/stopping recipe as 01; method-specific LR.
# Source hash is pinned; only embeddings and four interaction layers transfer.
# Fresh 0e+2e readout, symmetry-safe scales/offsets and optimizer.
# Pre-fit shielding scales/offsets on the selected N100 only; no test data.
# Rank 4 path-wise adapters; original backbone, including radial networks, frozen.
general:
  seed: 42
  progress: logged
model:
  +nmr_helpers.symmetric_elora.add_elora:
    rank: 4
    model:
      +nmr_helpers.symmetric_transfer.from_energy_force_model:
        checkpoint: graph-pes-results/04-EF-Pretrain-TensorBackbone-OpenEquivariance-9265688/model-e3nn.pt
        expected_sha256: c5229e19d27f1ed965bb507e48caa21bf0d837b5613f8efb44915fcf39513654
        freeze_backbone: true
        model:
          +nmr_helpers.symmetric_shielding.SymmetricTensorNequIP:
            elements:
            - Si
            - O
            cutoff: 6.0
            layers: 4
            radial_features: 64
            features:
              node_irreps: 128x0e + 128x0o + 128x1e + 128x1o + 128x2e + 128x2o
              edge_irreps: 1x0e + 1x1o + 1x2e
            prune_last_layer: true
            target_tensor_irreps: 0e + 2e
data:
  train:
    path: data/nmr_symm/train.xyz
    property_map:
      MS_Symm_Irreps: tensor
    n: 100
    shuffle: true
    seed: 42
  valid:
    path: data/nmr_symm/valid.xyz
    property_map:
      MS_Symm_Irreps: tensor
  test: null
loss:
  shielding:
    +nmr_helpers.symmetric_shielding.SymmetricBalancedMSE:
      si_iso_std: 8.789599019755547
      o_iso_std: 19.197689920683118
      si_aniso_rms: 18.027189481773213
      o_aniso_rms: 27.842888412488165
      weight: 1.0
fitting:
  pre_fit_model: true
  max_n_pre_fit: null
  callbacks:
  - +nmr_helpers.symmetric_shielding.SymmetricRMSELogger: {}
  trainer_kwargs:
    accelerator: auto
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 4
    max_epochs: 3000
    num_sanity_val_steps: 0
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  optimizer:
    name: AdamW
    lr: 0.003
    weight_decay: 0.01
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 300
  keep: best
wandb:
  entity: trin4011-university-of-oxford
  project: tensor-nmr-transfer
  name: 06-SymmetricTensor-ELoRA-N100-R4
  log_model: false
