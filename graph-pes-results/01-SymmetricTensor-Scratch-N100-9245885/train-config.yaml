data:
  test: null
  train:
    n: 100
    path: data/nmr_symm/train.xyz
    property_map:
      MS_Symm_Irreps: tensor
    seed: 42
    shuffle: true
  valid:
    path: data/nmr_symm/valid.xyz
    property_map:
      MS_Symm_Irreps: tensor
fitting:
  auto_fit_reference_energies: false
  callbacks:
  - +nmr_helpers.symmetric_shielding.SymmetricRMSELogger: {}
  early_stopping:
    patience: 300
  early_stopping_patience: null
  keep: best
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  lr_warmup_steps: null
  max_n_pre_fit: null
  optimizer:
    lr: 0.003
    name: AdamW
    weight_decay: 0.01
  pre_fit_model: true
  scheduler:
    factor: 0.8
    name: ReduceLROnPlateau
    patience: 25
  swa: null
  trainer_kwargs:
    accelerator: gpu
    accumulate_grad_batches: 4
    devices: 1
    enable_model_summary: false
    log_every_n_steps: 10
    max_epochs: 3000
    num_sanity_val_steps: 0
    precision: 32-true
general:
  log_level: INFO
  progress: logged
  root_dir: graph-pes-results
  run_id: 01-SymmetricTensor-Scratch-N100-9245885
  seed: 42
  torch:
    dtype: float32
    float32_matmul_precision: high
loss:
  shielding:
    +nmr_helpers.symmetric_shielding.SymmetricBalancedMSE:
      o_aniso_rms: 27.842888412488165
      o_iso_std: 19.197689920683118
      si_aniso_rms: 18.027189481773213
      si_iso_std: 8.789599019755547
      weight: 1.0
model:
  +nmr_helpers.symmetric_shielding.SymmetricTensorNequIP:
    cutoff: 6.0
    elements:
    - Si
    - O
    features:
      edge_irreps: 1x0e + 1x1o + 1x2e
      node_irreps: 128x0e + 128x0o + 128x1e + 128x1o + 128x2e + 128x2o
    layers: 4
    prune_last_layer: true
    radial_features: 64
    target_tensor_irreps: 0e + 2e
wandb:
  entity: trin4011-university-of-oxford
  log_model: false
  name: 01-SymmetricTensor-Scratch-N100-9245885
  project: tensor-nmr-transfer
