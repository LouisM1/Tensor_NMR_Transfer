data:
  test: null
  train:
    n: 800
    path: data/train.xyz
    property_map:
      QM_energy: energy
      QM_forces: forces
    seed: 42
    shuffle: true
  valid:
    path: data/valid.xyz
    property_map:
      QM_energy: energy
      QM_forces: forces
fitting:
  auto_fit_reference_energies: false
  callbacks: []
  early_stopping:
    patience: 300
  early_stopping_patience: null
  keep: best
  loader_kwargs:
    batch_size: 2
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  lr_warmup_steps: null
  max_n_pre_fit: null
  optimizer:
    lr: 0.003
    name: AdamW
    weight_decay: 0.01
  pre_fit_model: true
  scheduler:
    factor: 0.8
    name: ReduceLROnPlateau
    patience: 25
  swa: null
  trainer_kwargs:
    accelerator: gpu
    accumulate_grad_batches: 2
    devices: 1
    enable_model_summary: false
    log_every_n_steps: 10
    max_epochs: 1000
    num_sanity_val_steps: 0
    precision: 32-true
general:
  log_level: INFO
  progress: logged
  root_dir: graph-pes-results
  run_id: 04-EF-Pretrain-TensorBackbone-OpenEquivariance-9265688
  seed: 42
  torch:
    dtype: float32
    float32_matmul_precision: high
loss:
  energy:
    +PerAtomEnergyLoss:
      metric: MSE
      weight: 1000.0
  forces:
    +PropertyLoss:
      metric: MSE
      property: forces
      weight: 100.0
model:
  nequip:
    +nmr_helpers.tensor_ef_pretraining.TensorCompatibleEFNequIP:
      backbone_target_irreps: 0e + 2e
      cutoff: 6.0
      direct_force_predictions: false
      elements:
      - Si
      - O
      features:
        edge_irreps: 1x0e + 1x1o + 1x2e
        node_irreps: 128x0e + 128x0o + 128x1e + 128x1o + 128x2e + 128x2o
      layers: 4
      radial_features: 64
      readout_hidden_features: 128
      use_openequivariance: true
  offset: +LearnableOffset()
wandb:
  entity: trin4011-university-of-oxford
  log_model: false
  name: 04-EF-Pretrain-TensorBackbone-OpenEquivariance-9265688
  project: tensor-nmr-transfer
